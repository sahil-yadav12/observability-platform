global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by: [alertname, resource, instance]
  group_wait: 10s        # wait to batch alerts that fire together
  group_interval: 1m     # min time between notifications for a changed group
  repeat_interval: 4h    # re-notify if still firing
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: "null"
    - matchers: ['severity="critical"']
      receiver: critical-webhook
      group_wait: 0s
      repeat_interval: 1h

# A critical alert on a resource suppresses the warning for the same resource/target,
# so on-call gets one page instead of two.
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [resource, instance, job]
  # If the target is down, silence every other alert on that instance.
  - source_matchers: ['alertname="InstanceDown"']
    target_matchers: ['alertname!="InstanceDown"', 'severity=~"warning|critical"']
    equal: [instance]

receivers:
  - name: "null"

  - name: default-webhook
    webhook_configs:
      - url: http://webhook-logger:5001/alerts/warning
        send_resolved: true

  - name: critical-webhook
    webhook_configs:
      - url: http://webhook-logger:5001/alerts/critical
        send_resolved: true

