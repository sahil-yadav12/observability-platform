name: observability-platform

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- core stack
  prometheus:
    image: prom/prometheus:v2.54.1
    <<: *restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle          # allows `curl -X POST :9090/-/reload`
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - alertmanager
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *restart
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - webhook-logger
    networks: [observability]

  grafana:
    image: grafana/grafana:11.2.0
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-golden-signals.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [observability]

  # ---------------------------------------------------------------- exporters
  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: *restart
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro
    expose:
      - "9100"
    networks: [observability]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: *restart
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    networks: [observability]

  # ---------------------------------------------------------------- demo workload
  demo-app:
    build: ./demo-app
    image: demo-app:local
    <<: *restart
    environment:
      BASE_ERROR_RATE: "0.01"
    ports:
      - "8000:8000"
    networks: [observability]

  loadgen:
    build: ./demo-app
    image: demo-app:local
    <<: *restart
    command: ["python", "-u", "loadgen.py"]
    environment:
      TARGET: http://demo-app:8000
      RPS: "10"
    depends_on:
      - demo-app
    networks: [observability]

  # ---------------------------------------------------------------- notification sink
  webhook-logger:
    image: python:3.12-slim
    <<: *restart
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ./webhook-logger/server.py:/app/server.py:ro
    ports:
      - "5001:5001"
    networks: [observability]

networks:
  observability:

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
